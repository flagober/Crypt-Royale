<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Royale · Magias candidatas</title>
<style>body{background:#081510;color:#e3fff0;font:16px system-ui;margin:24px}header{position:sticky;top:0;background:#081510;padding:14px;z-index:1;border:1px solid #27543d;border-radius:16px}button{padding:12px;border-radius:10px;cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px}article{background:#11241b;border:1px solid #27543d;padding:16px;border-radius:16px}canvas{width:100%;image-rendering:pixelated}small{color:#a4c3b3}</style>
<header><h1>Magias dos 16 monstros</h1><p>Candidatas visuais · mecânicas especiais ainda não ativadas.</p><button id="pause">Pausar</button> <button id="restart">Repetir</button> <label><input id="reduced" type="checkbox"> Movimento reduzido</label><p id="status" role="status">Carregando…</p></header><main id="grid"></main>
<script type="module">
import { drawSpell } from './spell-effects.js';
const $=id=>document.getElementById(id);let elapsed=0,last=performance.now(),paused=false;const entries=[];
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Reproduzir':'Pausar';};$('restart').onclick=()=>{elapsed=0;};
try{const [a,b]=await Promise.all([fetch('./spell-catalog.json'),fetch('./animation-audit.json')]);if(!a.ok||!b.ok)throw Error('Catálogo indisponível');const spells=await a.json(),audit=await b.json();
for(const spell of spells){const unit=audit.units.find(u=>u.id===spell.id),article=document.createElement('article'),h=document.createElement('h2'),text=document.createElement('p'),canvas=document.createElement('canvas'),note=document.createElement('small');h.textContent=unit.name+' · '+spell.name;text.textContent=spell.description;canvas.width=320;canvas.height=200;note.textContent='Proposta visual; não aplica atributos ou dano.';article.append(h,canvas,text,note);$('grid').append(article);const image=new Image();image.src=unit.src;await image.decode();entries.push({spell,image,canvas});}
$('status').textContent=entries.length+' efeitos carregados. Aprovação visual pendente.';
function draw(now){if(!paused)elapsed+=Math.min(now-last,100);last=now;const cycle=elapsed%1800;for(const {spell,image,canvas}of entries){const c=canvas.getContext('2d');c.fillStyle='#192d24';c.fillRect(0,0,320,200);c.strokeStyle='#30563f';c.beginPath();c.moveTo(0,160);c.lineTo(320,160);c.stroke();c.imageSmoothingEnabled=false;c.drawImage(image,140,0,140,140,5,32,140,140);c.fillStyle='#6c8176';c.beginPath();c.arc(230,120,15,0,Math.PI*2);c.fill();if(cycle<900)drawSpell(c,spell,cycle,{x:230,y:120,reducedMotion:$('reduced').checked});}requestAnimationFrame(draw);}requestAnimationFrame(draw);
}catch(e){$('status').textContent='Falha: '+e.message;}
</script></html>
