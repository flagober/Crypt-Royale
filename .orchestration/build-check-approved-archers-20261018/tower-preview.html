<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Royale · Poderes das torres</title>
<style>body{background:#081510;color:#e3fff0;font:16px system-ui;margin:18px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}article{background:#11241b;border:1px solid #27543d;border-radius:14px;padding:15px}canvas{width:100%}button{padding:10px;cursor:pointer}</style>
<h1>Núcleo Operador e Torre Guardiã</h1><p>Disparo de núcleo, pulso de Bastião e projétil da Guardiã, usando os mesmos efeitos do combate.</p><button id="pause">Pausar</button> <a href="/">Abrir jogo</a><main id="grid"></main>
<script type="module">
import {drawTowerSpell} from './tower-effects.js';
const scenes=[['operator-core','Núcleo Operador · Disparo','cr_vila_byte_operator_core_master_v001.png'],['operator-bastion','Núcleo Operador · Bastião','cr_vila_byte_operator_core_master_v001.png'],['guard-tower','Torre Guardiã · Projétil','cr_vila_byte_guard_tower_master_v001.png']];const views=[];
for(const[id,name,file]of scenes){const article=document.createElement('article'),h=document.createElement('h2'),canvas=document.createElement('canvas'),image=new Image();h.textContent=name;canvas.width=320;canvas.height=240;image.src='./assets/towers/'+file;await image.decode();article.append(h,canvas);document.getElementById('grid').append(article);views.push({id,canvas,image});}
let time=0,last=performance.now(),paused=false;document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Reproduzir':'Pausar'};
function tick(now){if(!paused)time+=Math.min(100,now-last);last=now;for(const{id,canvas,image}of views){const ctx=canvas.getContext('2d');ctx.fillStyle='#192d24';ctx.fillRect(0,0,320,240);const scale=Math.min(130/image.width,180/image.height);ctx.drawImage(image,20,200-image.height*scale,image.width*scale,image.height*scale);ctx.fillStyle='#7b6a70';ctx.beginPath();ctx.arc(260,160,12,0,Math.PI*2);ctx.fill();drawTowerSpell(ctx,id,time%1800,{casterX:85,casterY:120,x:260,y:160,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches});}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
