<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Royale · Revisão de animações</title>
<style>body{margin:24px;background:#081510;color:#e5fff3;font:16px system-ui}header{position:sticky;top:0;background:#081510;padding:12px;z-index:1;border:1px solid #26543e;border-radius:16px}button,select,input{padding:9px;margin:5px;border-radius:8px}button{cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:20px}article{background:#10221a;border:1px solid #26543e;border-radius:16px;padding:15px;overflow:auto}canvas{width:100%;image-rendering:pixelated}img{height:200px;max-width:100%;object-fit:contain}small{color:#a4bbae}label{white-space:nowrap}</style>
<header><h1>Revisão dos 16 monstros e torres</h1><p>Caminhadas existentes · frente, direita, esquerda e costas. Ataque, dano e derrota próprios ainda pendentes.</p><button id="pause">Pausar</button><button id="step">Próximo quadro</button><label>Velocidade <select id="speed"><option value="0.5">0,5×</option><option selected value="1">1×</option><option value="2">2×</option></select></label><label>Zoom <select id="zoom"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label><label>Fundo <input id="background" type="color" value="#192d24"></label><label><input type="checkbox" id="idle">Repouso</label><p id="status" role="status">Carregando…</p></header><main id="grid"></main>
<script type="module">
const $=id=>document.getElementById(id);let paused=false,phase=0,last=performance.now(),step=0;const entries=[];
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Reproduzir':'Pausar'};
$('step').onclick=()=>{paused=true;$('pause').textContent='Reproduzir';step++;phase=step;};
try{const response=await fetch('./animation-audit.json');if(!response.ok)throw Error(response.status);const data=await response.json();
for(const unit of data.units){const card=document.createElement('article');const title=document.createElement('h2');title.textContent=unit.name;card.append(title);const canvas=document.createElement('canvas');canvas.width=560;canvas.height=168;card.append(canvas);const caption=document.createElement('small');caption.textContent='Frente · Direita · Esquerda · Costas | 3 poses, ciclo 0–1–2–1';card.append(caption);$('grid').append(card);const image=new Image();image.src=unit.src;await image.decode();entries.push({unit,image,canvas});}
for(const tower of data.towers){const card=document.createElement('article'),title=document.createElement('h2'),image=new Image(),note=document.createElement('p');title.textContent=tower.name;image.src=tower.src;image.alt=tower.name;await image.decode();note.textContent='Arte fixa aprovada. Efeitos existentes no combate; esta imagem não é um clipe animado.';card.append(title,image,note);$('grid').append(card);}
$('status').textContent=`${entries.length} monstros e ${data.towers.length} torres carregados. Linha verde = pivô do chão.`;
function draw(now){const delta=Math.min(now-last,100);last=now;if(!paused){phase+=delta/110*Number($('speed').value);step=Math.floor(phase);}for(const {unit,image,canvas}of entries){const ctx=canvas.getContext('2d');ctx.fillStyle=$('background').value;ctx.fillRect(0,0,560,168);ctx.imageSmoothingEnabled=false;const index=paused?Math.floor(phase):Math.floor(phase*110/unit.frameDurationMs),col=$('idle').checked?1:unit.playback[index%4];for(let row=0;row<4;row++){ctx.save();if(unit.id==='logic-lizard'&&row===1&&col===1){ctx.beginPath();ctx.rect(row*140,0,140,140);for(const[x,y,w,h]of[[13,58,8,21],[121,89,7,29]])ctx.rect(row*140+x,y,w,h);ctx.clip('evenodd');}ctx.drawImage(image,col*140,row*140,140,140,row*140,0,140,140);ctx.restore();ctx.strokeStyle='#44ff99';ctx.beginPath();ctx.moveTo(row*140,128);ctx.lineTo((row+1)*140,128);ctx.stroke();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText(`Coluna ${col+1}`,row*140+35,158);}canvas.style.width=`${560*Number($('zoom').value)/2}px`;}requestAnimationFrame(draw);}requestAnimationFrame(draw);
}catch(error){$('status').textContent='Falha ao carregar: '+error.message;}
</script></html>
