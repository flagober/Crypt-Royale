<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA — Tower Destruction VFX</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0; }
    main { width: min(94vw, 390px); }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0 0 12px; color: #94a3b8; font-size: 12px; }
    canvas { display: block; width: 100%; height: auto; border: 1px solid #164e63; border-radius: 22px; background: #082f49; }
    button { width: 100%; min-height: 44px; margin-top: 12px; border: 1px solid #22d3ee88; border-radius: 12px; background: #0f172a; color: #cffafe; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <h1>QA — Ruínas das torres</h1>
    <p>Renderização do módulo real. Inimigo em rosa, jogador em ciano; guards nas laterais e cores no centro.</p>
    <canvas id="arena" width="360" height="560" aria-label="Prévia dos destroços das torres"></canvas>
    <button id="replay" type="button">Repetir destruição</button>
  </main>
  <script type="module">
    import {
      drawTowerDestructionVFX,
      notifyTowerDestroyedVFX,
      resetTowerDestructionVFX,
      tickTowerDestructionVFX,
    } from '/src/game/vfx-tower-destruction.js';

    const canvas = document.querySelector('#arena');
    const ctx = canvas.getContext('2d');
    const towers = [
      { id: 'enemy-left', team: 'enemy', type: 'guard', x: 88, y: 92, hp: 0 },
      { id: 'enemy-core', team: 'enemy', type: 'core', x: 180, y: 58, hp: 0 },
      { id: 'enemy-right', team: 'enemy', type: 'guard', x: 272, y: 92, hp: 0 },
      { id: 'player-left', team: 'player', type: 'guard', x: 88, y: 468, hp: 0 },
      { id: 'player-core', team: 'player', type: 'core', x: 180, y: 502, hp: 0 },
      { id: 'player-right', team: 'player', type: 'guard', x: 272, y: 468, hp: 0 },
    ];
    let elapsed = 0;
    let previous = performance.now();

    function reset() {
      resetTowerDestructionVFX();
      elapsed = 0;
      for (const tower of towers) notifyTowerDestroyedVFX(tower.id, tower.type, tower.team);
    }

    function background() {
      const gradient = ctx.createLinearGradient(0, 0, 0, 560);
      gradient.addColorStop(0, '#3f1325');
      gradient.addColorStop(.48, '#172554');
      gradient.addColorStop(.52, '#164e63');
      gradient.addColorStop(1, '#082f49');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 360, 560);
      ctx.strokeStyle = 'rgba(125,211,252,.09)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= 360; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 560); ctx.stroke(); }
      for (let y = 0; y <= 560; y += 28) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(360, y); ctx.stroke(); }
      ctx.fillStyle = 'rgba(6,182,212,.32)';
      ctx.fillRect(0, 265, 360, 30);
    }

    function frame(now) {
      const dt = Math.min(100, now - previous);
      previous = now;
      elapsed += dt;
      tickTowerDestructionVFX(dt, towers);
      background();
      for (const tower of towers) drawTowerDestructionVFX(ctx, tower, elapsed);
      requestAnimationFrame(frame);
    }

    document.querySelector('#replay').addEventListener('click', reset);
    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
