<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypt Royale · QA das evoluções</title><style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#070d22;color:#e6f5ff;font:15px system-ui}h1{margin:0 0 8px;color:#67e8f9}p{color:#b7c8de}button,select{padding:12px;background:#172445;color:white;border:1px solid #536b95;border-radius:10px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:24px;margin-top:20px}.arena{display:block;width:100%;image-rendering:pixelated;border:1px solid #596e93;border-radius:12px}.clips{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:14px}.clip{background:#111b36;border:1px solid #344d79;padding:12px;border-radius:14px}.clip h2{font-size:17px;margin:0 0 5px}.clip canvas{width:100%;height:auto;image-rendering:pixelated;background:repeating-conic-gradient(#12243b 0% 25%,#1c3048 0% 50%) 0 0/20px 20px;border-radius:8px}.clip p{font-size:12px;margin:8px 0 0}output{color:#99f6c5;display:block;padding:10px 0}@media(max-width:800px){body{padding:12px}.layout{grid-template-columns:1fr}.clips{grid-template-columns:1fr}.arena{max-width:360px;margin:auto}}
</style></head><body><h1>As evoluções entram na arena</h1><p>Prévia isolada · nenhum recurso ou progresso de jogador é alterado.</p><header><button id="pause">Pausar</button><label>Bit Bug <select id="form"><option value="1">Mk-II</option><option value="2">Apex</option></select></label><label>Defesa <select id="sex"><option value="male">Paladino</option><option value="female">Paladina</option></select></label></header><output id="status">Carregando artes…</output><div class="layout"><section><canvas class="arena" id="battle" width="360" height="560"></canvas><p id="battle-status"></p></section><div class="clips" id="clips"></div></div><script type="module">
import{createProgress}from'/src/game/activities.js';import{evolveMonster,specializeClass}from'/src/game/progression.js';import{configureCampaign}from'/src/game/progression-engine.js';import{createGame,deployCard,stepGame}from'/src/game/engine.js';import{renderGame}from'/src/game/render.js';import{prepareTowerArt}from'/src/game/tower-assets.js';import{prepareMapArt}from'/src/game/map-art.js';import{spriteProfile,selectSpriteFrame}from'/src/game/sprite-animation.js';
const defs=[['Bit Bug Mk-II','/assets/units/bit-bug-mk2-spritesheet-v001.png',3],['Bit Bug Apex','/assets/units/bit-bug-apex-spritesheet-v001.png',3],['Paladino','/assets/class-evolutions/paladin-male-attack-v001.png',4],['Paladina','/assets/class-evolutions/paladin-female-attack-v001.png',4]],clips=[];
for(const[name,file,cols]of defs){const box=document.createElement('section');box.className='clip';box.innerHTML='<h2>'+name+'</h2><canvas width="560" height="160"></canvas><p>Frente · direita · esquerda · costas | '+(cols===3?'Caminhada A → passagem → B → passagem':'Repouso → preparo → disparo → recuperação')+'</p>';document.querySelector('#clips').append(box);const image=new Image();image.src=file;await image.decode();clips.push({image,cols,ctx:box.querySelector('canvas').getContext('2d')});}
await prepareTowerArt();let game,paused=false,t=0,last=performance.now(),nextDeploy=0;
function reset(){let p=createProgress();p.wallet.gold=10000;p.wallet.cards['bit-bug']=100;p.progression.classes.warrior.cards=10;for(let i=0;i<Number(document.querySelector('#form').value);i++)p=evolveMonster(p,'bit-bug',i);p=specializeClass(p,'warrior','paladin');game=configureCampaign(createGame(),p,'stage-1');game.towers.find(x=>x.id==='player-core').appearance=document.querySelector('#sex').value;game.playerEnergy=10;deployCard(game,'bit-bug',58,390);nextDeploy=5000;prepareMapArt(game.mapId);document.querySelector('#status').textContent='4 folhas carregadas · 56 quadros · batalha usa o mesmo renderizador do jogo';}
const advance=document.createElement('button');advance.textContent='Avançar batalha 10s';document.querySelector('header').append(advance);advance.onclick=()=>{for(let i=0;i<600;i++)stepGame(game,1000/60);};const pose=document.createElement('button');pose.textContent='Pose seguinte';document.querySelector('header').append(pose);pose.onclick=()=>{t+=180;};
document.querySelector('#form').onchange=reset;document.querySelector('#sex').onchange=reset;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausar';};reset();
function frame(now){const dt=Math.min(35,now-last);last=now;if(!paused){t+=dt;stepGame(game,dt);if(game.nowMs>=nextDeploy&&game.status==='playing'){game.playerEnergy=10;deployCard(game,'bit-bug',58,410);nextDeploy+=5000;}}renderGame(document.querySelector('#battle').getContext('2d'),game,null);document.querySelector('#battle-status').textContent='Forma '+document.querySelector('#form').selectedOptions[0].text+' · '+document.querySelector('#sex').selectedOptions[0].text+' · '+Math.floor(game.nowMs/1000)+'s';for(const clip of clips){const c=clip.ctx;c.clearRect(0,0,560,160);c.imageSmoothingEnabled=false;for(let row=0;row<4;row++){const col=clip.cols===3?selectSpriteFrame(spriteProfile(),t,true,['down','right','left','up'][row]).column:[0,0,1,2,3,0][Math.floor(t/180)%6];c.drawImage(clip.image,col*140,row*140,140,140,row*140,10,140,140);}}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
