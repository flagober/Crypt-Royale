<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guerreiro — caminhada frontal candidata</title><style>body{background:#101725;color:#e9eef7;font:16px system-ui;margin:24px auto;max-width:1050px;padding:16px}button,input{margin:8px;padding:10px}canvas{display:block;width:min(100%,440px);background:repeating-conic-gradient(#142337 0% 25%,#21354b 0% 50%) 0 0/24px 24px}img{width:100%;margin-top:20px}p{line-height:1.5;color:#b7c9dd}</style><h1>Guerreiro masculino — frente, v002 aprovada — recorte corrigido</h1><p>Estudo de oito poses: ainda sem alinhamento final, repouso e demais direções. Confira pernas, continuidade, rosto e equipamentos. A grade abaixo é a fonte gerada; o visor reproduz as células aproximadas, sem normalizar pivôs.</p><button id="play">Pausar</button><button id="prev">Anterior</button><button id="next">Próximo</button><label>Ritmo <input id="speed" type="range" min="2" max="14" value="8"></label><output id="info"></output><canvas id="view" width="444" height="444"></canvas><img src="/assets/animation-lab/warrior-male-down8-candidate-v002.png" alt="Oito poses em duas linhas de quatro"><script>
const img=new Image(),canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let frame=0,play=true,last=0;const button=document.getElementById('play'),speed=document.getElementById('speed');function draw(){if(!img.complete||!img.naturalWidth)return;const w=img.naturalWidth/4,h=img.naturalHeight/2;ctx.clearRect(0,0,444,444);ctx.drawImage(img,(frame%4)*w,Math.floor(frame/4)*h,w,h,0,0,444,444);if(frame===1||frame===5){ctx.clearRect(0,210,18,140);}document.getElementById('info').textContent=`Quadro ${frame+1}/8 · ${speed.value} fps`;}button.onclick=()=>{play=!play;button.textContent=play?'Pausar':'Reproduzir';last=0};function step(d){play=false;button.textContent='Reproduzir';frame=(frame+d+8)%8;draw();}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);speed.oninput=draw;img.onload=draw;img.onerror=()=>document.getElementById('info').textContent='Falha ao carregar candidato';img.src='/assets/animation-lab/warrior-male-down8-candidate-v002.png';function loop(t){if(play&&t-last>=1000/Number(speed.value)){frame=(frame+1)%8;last=t;draw();}requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
